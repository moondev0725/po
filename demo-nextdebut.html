<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXT DEBUT Demo</title>
  <link rel="stylesheet" href="demo.css" />
</head>
<body class="nextdebut">
  <div class="demo-shell">
    <header class="demo-topbar">
      <div class="brand">
        <span class="brand-mark">ND</span>
        <span>NEXT DEBUT</span>
      </div>
    </header>

    <main>
      <section class="demo-hero" data-demo-root>
        <div class="demo-copy">
          <p class="eyebrow" data-demo-eyebrow>K-POP Training Simulation</p>
          <h1 class="demo-title" data-demo-title>NEXT<br />DEBUT</h1>
          <p class="demo-desc" data-demo-desc>
            사용자 선택이 연습생 능력치, 팬 수, 이벤트, 데뷔 결과로 이어지는
            아이돌 육성 시뮬레이션 서비스의 메인 화면 느낌을 정적으로 구성했습니다.
          </p>
        </div>

        <div class="demo-stage">
          <div class="stage-viewport">
            <img src="./images/01_cover_main_hero.png" alt="NEXT DEBUT 메인 화면 미리보기" />
            <span class="demo-hotspot hotspot-notice" data-eyebrow="NOTICE" data-title="공지&nbsp;사항" data-desc="서비스 업데이트, 이벤트, 운영 안내를 사용자에게 전달하는 공지 진입 메뉴입니다."></span>
            <span class="demo-hotspot hotspot-guide" data-eyebrow="GUIDE" data-title="게임&nbsp;가이드" data-desc="처음 접속한 사용자가 육성 방식, 능력치 변화, 선택 흐름을 이해할 수 있도록 돕는 안내 메뉴입니다."></span>
            <span class="demo-hotspot hotspot-index" data-eyebrow="INDEX" data-title="연습생&nbsp;도감" data-desc="연습생 목록, 등급, 능력치, 보유 상태를 카드형 UI로 탐색하는 수집형 도감 기능입니다."></span>
            <span class="demo-hotspot hotspot-board" data-eyebrow="BOARD" data-title="커뮤니티<br />게시판" data-desc="사용자들이 플레이 정보와 후기를 공유하고 댓글로 소통하는 커뮤니티 게시판입니다."></span>
            <span class="demo-hotspot hotspot-fanmeeting" data-eyebrow="FANMEETING" data-title="팬미팅&nbsp;게시판" data-desc="지도와 게시글을 연결해 팬미팅 장소와 참여 정보를 함께 확인하는 커뮤니티 기능입니다."></span>
            <span class="demo-hotspot hotspot-casting" data-eyebrow="CASTING" data-title="길거리&nbsp;캐스팅" data-desc="코인 시스템과 연동된 뽑기 흐름으로 연습생 또는 포토카드를 획득하는 기능입니다."></span>
            <span class="demo-hotspot hotspot-report" data-eyebrow="REPORT" data-title="신고&nbsp;게시판" data-desc="부적절한 게시글과 사용자 활동을 신고하고 관리자 처리 흐름으로 연결하는 운영 기능입니다."></span>
            <span class="demo-hotspot hotspot-shop" data-eyebrow="SHOP" data-title="상점&nbsp;/&nbsp;뽑기" data-desc="코인 충전, 아이템 구매, 포토카드 뽑기와 KakaoPay 결제 흐름으로 이어지는 상점 영역입니다."></span>
            <span class="demo-hotspot hotspot-login" data-eyebrow="LOGIN" data-title="로그인" data-desc="회원별 게임 데이터, 코인, 포토카드, 연습생 보유 정보를 불러오기 위한 인증 진입 버튼입니다."></span>
            <span class="demo-hotspot hotspot-signup" data-eyebrow="SIGN UP" data-title="회원&nbsp;가입" data-desc="신규 사용자가 계정을 생성하고 개인화된 육성 시뮬레이션 흐름을 시작하는 진입 버튼입니다."></span>
            <span class="demo-hotspot hotspot-search" data-eyebrow="SEARCH" data-title="통합&nbsp;검색" data-desc="연습생, 게시글, 팬미팅, 상점 아이템 등 서비스 안의 주요 정보를 빠르게 찾는 검색 영역입니다."></span>
            <span class="demo-hotspot hotspot-bgm" data-eyebrow="BGM" data-title="배경&nbsp;음악" data-desc="메인 화면의 몰입감을 높이기 위해 프로젝트 분위기에 맞춘 BGM을 제어하는 버튼입니다."></span>
            <span class="demo-hotspot hotspot-enter" data-eyebrow="START" data-title="게임&nbsp;시작" data-desc="연습생을 선택하고 육성 시뮬레이션의 핵심 플레이 흐름으로 진입하는 메인 CTA 버튼입니다."></span>
            <span class="demo-hotspot hotspot-ranking" data-eyebrow="RANKING" data-title="TOP&nbsp;랭킹" data-desc="사용자 점수와 활동 결과를 랭킹 카드로 보여주며 플레이 동기를 강화하는 영역입니다."></span>
            <span class="demo-hotspot hotspot-popular-board" data-eyebrow="POPULAR BOARD" data-title="인기&nbsp;게시글" data-desc="조회와 참여가 많은 게시글을 메인에서 바로 노출해 커뮤니티 진입을 유도하는 카드입니다."></span>
            <span class="demo-hotspot hotspot-popular-item" data-eyebrow="POPULAR ITEM" data-title="인기&nbsp;아이템" data-desc="상점에서 자주 구매하거나 주목받는 아이템을 메인 카드로 보여주는 영역입니다."></span>
            <span class="demo-hotspot hotspot-live-pick" data-eyebrow="LIVE PICK" data-title="인기&nbsp;연습생" data-desc="현재 주목받는 연습생을 카드 형태로 보여주고 상세 정보로 이어지는 메인 추천 영역입니다."></span>
            <span class="demo-hotspot hotspot-sidebar" data-eyebrow="QUICK MENU" data-title="우측&nbsp;사이드바" data-desc="게임, 챗봇, 게시판, 팬미팅, 가이드 등 주요 기능으로 빠르게 이동할 수 있는 퀵 메뉴 영역입니다."></span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="demo.js"></script>
</body>
</html>
