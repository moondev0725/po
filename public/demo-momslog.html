<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moms Log Demo</title>
  <link rel="stylesheet" href="demo.css" />
</head>
<body class="momslog">
  <div class="demo-shell">
    <header class="demo-topbar">
      <div class="brand">
        <span class="brand-mark">ML</span>
        <span>Moms Log</span>
      </div>
    </header>

    <main>
      <section class="demo-hero" data-demo-root>
        <div class="demo-copy">
          <p class="eyebrow" data-demo-eyebrow>Local Community Service</p>
          <h1 class="demo-title" data-demo-title>Moms<br />Log</h1>
          <p class="demo-desc" data-demo-desc>
            회원가입, 회원등급, 마이페이지, 지도 기반 동네마켓을 하나의 흐름으로 연결한
            지역 커뮤니티 서비스의 메인 화면 느낌을 정적으로 구성했습니다.
          </p>
        </div>

        <div class="demo-stage">
          <div class="stage-viewport">
            <img src="./images/momslog-main.png" alt="Moms Log 메인 화면 미리보기" />
            <span class="demo-hotspot moms-hotspot-search" data-eyebrow="SEARCH" data-title="통합&nbsp;검색" data-desc="육아 정보, 게시글, 레시피, 동네마켓 상품을 한 번에 탐색할 수 있는 메인 검색 영역입니다."></span>
            <span class="demo-hotspot moms-hotspot-auth" data-eyebrow="AUTH" data-title="로그인&nbsp;/<br />회원가입" data-desc="로그인, 회원가입, 관리자 진입을 한곳에 모아 사용자의 계정 흐름을 시작하는 영역입니다."></span>
            <span class="demo-hotspot moms-hotspot-notice" data-eyebrow="NOTICE" data-title="공지사항&nbsp;/<br />이벤트" data-desc="서비스 공지와 이벤트 안내를 확인하는 커뮤니티 운영 메뉴입니다."></span>
            <span class="demo-hotspot moms-hotspot-story" data-eyebrow="MOM STORY" data-title="엄마&nbsp;이야기" data-desc="육아 고민과 공감 글을 나누는 커뮤니티 게시판으로, 댓글과 반응을 통해 사용자 참여를 유도합니다."></span>
            <span class="demo-hotspot moms-hotspot-meal" data-eyebrow="TODAY MEAL" data-title="오늘&nbsp;밥상" data-desc="육아 식단과 레시피 정보를 공유하며 사용자가 필요한 식사 아이디어를 빠르게 찾는 메뉴입니다."></span>
            <span class="demo-hotspot moms-hotspot-pet" data-eyebrow="PET" data-title="반려&nbsp;동물" data-desc="반려동물 관련 게시글과 정보를 나누는 확장 커뮤니티 메뉴입니다."></span>
            <span class="demo-hotspot moms-hotspot-guide" data-eyebrow="PARENTING GUIDE" data-title="육아&nbsp;가이드" data-desc="월령별 발달 정보와 육아 콘텐츠를 제공해 정보 탐색 흐름을 보조하는 메뉴입니다."></span>
            <span class="demo-hotspot moms-hotspot-market-nav" data-eyebrow="LOCAL MARKET" data-title="동네&nbsp;마켓" data-desc="지역 기반 중고거래 기능으로 이동하는 메뉴입니다. 상품 등록, 찜, 댓글, 거래상태 변경 흐름과 연결됩니다."></span>
            <span class="demo-hotspot moms-hotspot-hero" data-eyebrow="EMPATHY BANNER" data-title="공감&nbsp;배너" data-desc="메인에서 사용자 공감 메시지를 크게 보여주고, 엄마 이야기 게시판으로 자연스럽게 진입시키는 영역입니다."></span>
            <span class="demo-hotspot moms-hotspot-hotpost" data-eyebrow="HOT POSTS" data-title="인기&nbsp;고민글" data-desc="댓글과 반응이 많은 게시글을 메인에서 노출해 커뮤니티 참여를 높이는 카드 영역입니다."></span>
            <span class="demo-hotspot moms-hotspot-login-card" data-eyebrow="LOGIN CARD" data-title="로그인&nbsp;카드" data-desc="비로그인 사용자에게 로그인과 회원가입을 안내하고 개인화된 육아 기록 시작을 유도하는 영역입니다."></span>
            <span class="demo-hotspot moms-hotspot-calendar" data-eyebrow="CALENDAR" data-title="육아&nbsp;캘린더" data-desc="월별 일정을 확인하고 육아 기록, 활동 관리 흐름으로 이어지는 캘린더 위젯입니다."></span>
            <span class="demo-hotspot moms-hotspot-chat" data-eyebrow="CHATBOT" data-title="챗봇&nbsp;상담" data-desc="육아 질문을 빠르게 입력하거나 상담형 도움을 받을 수 있는 플로팅 챗봇 진입 버튼입니다."></span>
            <span class="demo-hotspot moms-hotspot-quick" data-eyebrow="LIVE CHAT" data-title="실시간&nbsp;채팅방" data-desc="사용자들이 실시간으로 육아 고민과 정보를 나눌 수 있는 채팅방 진입 버튼입니다."></span>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="demo.js"></script>
</body>
</html>
